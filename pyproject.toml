[project]
name = "pos_bahrain"
authors = [
    { name = "9t9it", email = "9t9it@gmail.com" }
]
description = "Pos Customization"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "toolz~=0.9.0",
    "numpy~=1.26.0",
    "pandas~=2.3.2"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Optional: Add tools configuration like black or ruff
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"


[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
